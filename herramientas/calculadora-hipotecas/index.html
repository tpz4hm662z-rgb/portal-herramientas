       <p class="subtitulo">

</p>

        <label>Importe de la vivienda (€)</label>
        <input type="number" id="importe" placeholder="Ej: 250000">

        <label>Entrada aportada (€)</label>
        <input type="number" id="entrada" placeholder="Ej: 50000">

        <label>Interés anual (%)</label>
        <input type="number" id="interes" placeholder="Ej: 3">

        <label>Plazo (años)</label>
        <input type="number" id="anos" placeholder="Ej: 30">

        <button onclick="calcularHipoteca()">Calcular Hipoteca</button>
