<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{display:block;width:100%;height:2600px;border:0}</style></head><body><iframe id="app" src="../index.html"></iframe><script>document.getElementById("app").addEventListener("load",function(){const d=this.contentDocument;function set(id,v){const x=d.getElementById(id);x.value=v;x.dispatchEvent(new Event("input",{bubbles:true}))}function radio(n,v){const x=d.querySelector('input[name="'+n+'"][value="'+v+'"]');x.checked=true;x.dispatchEvent(new Event("change",{bubbles:true}))}radio("generalRegime","yes");set("birthDate","1961-06-15");set("asOfDate","2026-06-15");set("contributionYears","38");set("contributionMonths","3");radio("continueContributing","no");radio("specificCarence","yes");d.getElementById("retirement-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));d.getElementById("pension-module").open=true;set("baseRegulatory","2000");d.getElementById("calculate-pension").click();d.getElementById("deferred-module").open=true;radio("effectiveDeferral","yes");d.getElementById("calculate-deferred").click();});</script></body></html>
