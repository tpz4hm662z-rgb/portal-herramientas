        <label>Edad actual</label>
        <input type="number" id="edadActual" placeholder="Ej: 35">

        <label>Aportación mensual (€)</label>
        <input type="number" id="aportacionMensual" placeholder="Ej: 300">

        <label>Rentabilidad anual estimada (%)</label>

        <button onclick="calcularJubilacion()">
