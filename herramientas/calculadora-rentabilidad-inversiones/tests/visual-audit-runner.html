<!doctype html><html><meta charset="utf-8"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}</style><iframe id="app" src="../index.html"></iframe>
<script>
const state=new URLSearchParams(location.search).get("state")||"initial",frame=document.getElementById("app");
frame.addEventListener("load",()=>{const w=frame.contentWindow,d=frame.contentDocument,set=(id,v)=>{d.getElementById(id).value=v;},submit=()=>d.getElementById("form-rentabilidad").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true})),add=(date,type,amount)=>{w.RentabilidadUI.addMovement();const row=d.querySelector(".movimiento:last-child");row.querySelector("[data-field=date]").value=date;row.querySelector("[data-field=type]").value=type;row.querySelector("[data-field=amount]").value=amount;};
 if(state==="initial")return;
 if(state==="errors"){submit();return;}
 set("initialInvestment",state==="multiple"?"100":"10000");set("finalValue",state==="negative"?"7500":state==="multiple"?"132":"12500");set("startDate","2021-01-01");set("endDate",state==="multiple"?"2023-01-01":"2024-03-01");
 if(state==="advanced"){d.getElementById("opciones-avanzadas").open=true;set("income","500");set("costs","180");set("inflationRate","2.5");}
 if(state==="movements"){d.getElementById("movimientos-bloque").open=true;add("2022-04-10","contribution","1500");add("2023-06-15","withdrawal","400");return;}
 if(state==="multiple"){add("2022-01-01","withdrawal","230");add("2023-01-01","contribution","264");}
 submit();setTimeout(()=>d.getElementById("resultados").scrollIntoView(),50);
});
</script></html>
