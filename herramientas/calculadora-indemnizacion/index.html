        <h1>Calculadora de Indemnización por Despido</h1>

        <label>Salario bruto mensual (€)</label>

        <label>Fecha de inicio en la empresa</label>

        </select>

        <button onclick="calcularIndemnizacion()">Calcular indemnización</button>

    <h3>Tipos de despido</h3>

    <p>
        <strong>Despido Objetivo:</strong>
        20 días por año trabajado con un máximo de 12 mensualidades.
    </p>

    <p>
        <strong>Despido Improcedente:</strong>
        33 días por año trabajado con un máximo de 24 mensualidades.
