<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tests SEO · Sueldo Neto PRO</title><style>body{margin:0;padding:20px;background:#eef2f7;color:#0f172a;font:15px/1.45 system-ui}main{max-width:1100px;margin:auto}iframe{display:block;width:100%;height:700px;border:1px solid #94a3b8;background:#fff}.pass{color:#047857}.fail{color:#b42318}pre{padding:16px;background:#fff;border-radius:10px;white-space:pre-wrap}</style></head>
<body><main><h1>Suite SEO · Sueldo Neto PRO</h1><p id="summary" aria-live="polite">Cargando…</p><pre id="output"></pre><iframe id="page" title="Página bajo prueba" src="../herramientas/calculadora-sueldo-neto/index.html"></iframe></main>
<script>(function(){"use strict";var frame=document.getElementById("page"),summary=document.getElementById("summary"),output=document.getElementById("output"),results=[];function ok(value,message){if(!value)throw new Error(message||"Aserción fallida")}function test(name,fn){try{fn();results.push({ok:true,name:name})}catch(error){results.push({ok:false,name:name,error:error.message})}}function finish(){var passed=results.filter(function(x){return x.ok}).length,failed=results.length-passed;summary.textContent=passed+" PASS · "+failed+" FAIL";summary.className=failed?"fail":"pass";output.textContent=results.map(function(x){return(x.ok?"PASS ":"FAIL ")+x.name+(x.error?" — "+x.error:"")}).join("\n");window.ImoancySEOReport={passed:passed,failed:failed,results:results}}
frame.addEventListener("load",async function(){var d=frame.contentDocument,html=d.documentElement.innerHTML,jsonScripts=d.querySelectorAll('script[type="application/ld+json"]'),graph;
  test("title único y descriptivo",function(){ok(d.querySelectorAll("title").length===1);ok(d.title.includes("Sueldo Neto")&&d.title.includes("2026")&&d.title.includes("España"))});
  test("description útil",function(){var value=d.querySelector('meta[name="description"]').content;ok(value.length>=120&&value.length<=170);ok(value.includes("IRPF")&&value.includes("14 pagas"))});
  test("canonical correcto",function(){ok(d.querySelector('link[rel="canonical"]').href==="https://imoancy.com/herramientas/calculadora-sueldo-neto/")});
  test("robots index follow",function(){var value=d.querySelector('meta[name="robots"]').content.toLowerCase();ok(value.includes("index")&&value.includes("follow")&&!value.includes("noindex"))});
  test("lang y viewport",function(){ok(d.documentElement.lang==="es");ok(d.querySelector('meta[name="viewport"]'))});
  test("H1 único",function(){ok(d.querySelectorAll("h1").length===1);ok(d.querySelector("h1").textContent.includes("Sueldo Neto PRO"))});
  test("breadcrumb visible",function(){var b=d.querySelector('.breadcrumb[aria-label="Migas de pan"]');ok(b&&b.textContent.includes("Inicio")&&b.textContent.includes("Sueldo Neto PRO"))});
  test("Open Graph completo",function(){["og:type","og:locale","og:site_name","og:title","og:description","og:url","og:image"].forEach(function(p){ok(d.querySelector('meta[property="'+p+'"]'),p)})});
  test("Twitter completo",function(){["twitter:card","twitter:title","twitter:description","twitter:image","twitter:image:alt"].forEach(function(n){ok(d.querySelector('meta[name="'+n+'"]'),n)})});
  test("favicon oficial",function(){ok(d.querySelector('link[rel="icon"][href*="assets/brand"]'))});
  test("Apple Touch Icon",function(){ok(d.querySelector('link[rel="apple-touch-icon"][href*="assets/brand"]'))});
  test("JSON-LD único y parseable",function(){ok(jsonScripts.length===1);graph=JSON.parse(jsonScripts[0].textContent)["@graph"];ok(Array.isArray(graph))});
  graph=JSON.parse(jsonScripts[0].textContent)["@graph"];
  function entity(type){return graph.find(function(item){return item["@type"]===type})}
  test("Organization",function(){ok(entity("Organization")["@id"]==="https://imoancy.com/#organization")});
  test("WebPage relacionada",function(){var page=entity("WebPage");ok(page.publisher["@id"]==="https://imoancy.com/#organization");ok(page.about["@id"].endsWith("#software"));ok(page.breadcrumb["@id"].endsWith("#breadcrumb"))});
  test("SoftwareApplication gratuita",function(){var app=entity("SoftwareApplication");ok(app.offers.price==="0"&&app.offers.priceCurrency==="EUR");ok(!app.aggregateRating&&!app.review)});
  test("BreadcrumbList coherente",function(){var items=entity("BreadcrumbList").itemListElement;ok(items.length===2&&items[0].name==="Inicio"&&items[1].name==="Calculadora de Sueldo Neto PRO")});
  test("FAQPage presente",function(){ok(entity("FAQPage").mainEntity.length>=15)});
  test("FAQ visible coincide con Schema",function(){var visible=Array.from(d.querySelectorAll("#preguntas-frecuentes details")).map(function(x){return{x:x.querySelector("summary").textContent.trim(),a:x.querySelector("p").textContent.trim()}}),schema=entity("FAQPage").mainEntity;ok(visible.length===schema.length);visible.forEach(function(item,index){ok(item.x===schema[index].name,"pregunta "+index);ok(item.a===schema[index].acceptedAnswer.text,"respuesta "+index)})});
  test("IDs JSON-LD únicos",function(){var ids=graph.map(function(x){return x["@id"]}).filter(Boolean);ok(new Set(ids).size===ids.length)});
  test("IDs HTML únicos",function(){var ids=Array.from(d.querySelectorAll("[id]")).map(function(x){return x.id});ok(new Set(ids).size===ids.length)});
  test("metodología pública",function(){var section=d.getElementById("metodologia");ok(section&&section.textContent.includes("Año y ámbito")&&section.textContent.includes("Precisión")&&section.textContent.includes("Solidaridad"))});
  test("responsabilidad editorial",function(){ok(d.getElementById("metodologia").textContent.includes("Responsable editorial: Imoancy"));ok(d.querySelector('time[datetime="2026-08-11"]'))});
  test("limitaciones visibles",function(){var value=d.getElementById("limitaciones").textContent;ok(value.includes("País Vasco")&&value.includes("incapacidad temporal")&&value.includes("regularización mensual"))});
  test("fuentes oficiales",function(){var links=d.querySelectorAll("#fuentes a");ok(links.length===4);ok(Array.from(links).every(function(a){return /agenciatributaria|boe\.es|seg-social\.es/.test(a.href)}))});
  test("ejemplos del motor",function(){var value=d.getElementById("ejemplos").textContent;ok(value.includes("23.124,00 €")&&value.includes("178,75 €"))});
  test("malla interna contextual",function(){["calculadora-ahorro","calculadora-hipotecas","calculadora-finiquito"].forEach(function(slug){ok(d.querySelector('.siguientes-pasos a[href*="'+slug+'"]'),slug)})});
  test("tres tarjetas finales",function(){var links=d.querySelectorAll("#herramientas-relacionadas .imoancy-related__card");ok(links.length===3);ok(Array.from(links).some(function(a){return a.href.includes("calculadora-finiquito")}));ok(!Array.from(links).some(function(a){return a.href.includes("calculadora-fire")}))});
  test("GA4 único",function(){ok(d.querySelectorAll('script[src*="G-QH8MJ6LVHN"]').length===1);ok((html.match(/gtag\("config","G-QH8MJ6LVHN"\)/g)||[]).length===1)});
  test("sin marcas ni URLs antiguas",function(){ok(!/github\.io|Herramientas360/i.test(html))});
  test("sin noindex",function(){ok(!/noindex/i.test(html))});
  test("jerarquía editorial",function(){ok(d.querySelector("article.guia-editorial h2"));ok(d.querySelector("#nomina-variable h3"));ok(!d.querySelector("h4"))});
  test("responsive editorial sin overflow",function(){[320,375,390,430,768,1024,1440].forEach(function(width){frame.style.width=width+"px";ok(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,width+": "+d.documentElement.scrollWidth+"/"+d.documentElement.clientWidth)});frame.style.width="100%"});
  try{var files=await Promise.all([fetch("../sitemap.xml").then(function(r){return r.text()}),fetch("../sitemaps/sitemap-herramientas.xml").then(function(r){return r.text()}),fetch("../robots.txt").then(function(r){return r.text()})]);test("sitemap contiene canonical",function(){ok(files[0].includes("sitemap-herramientas.xml"));ok(files[1].includes("https://imoancy.com/herramientas/calculadora-sueldo-neto/"))});test("robots no bloquea herramienta",function(){ok(!/Disallow:\s*\/herramientas\/calculadora-sueldo-neto/i.test(files[2]))})}catch(error){results.push({ok:false,name:"sitemap y robots accesibles",error:error.message})}
  finish();
});}());</script></body></html>
